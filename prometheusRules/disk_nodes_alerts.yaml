apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: disk-usage-alert
  namespace: observabilidade
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: disk-usage-alerts
      rules:
        - alert: HighDiskUsage
          expr: >
            (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 70
          for: 5m
          labels:
            severity: warning
            channel: telegram-homelab
          annotations:
            description: "🚨 O uso de disco na instância *{{ $labels.instance }}* atingiu {{ printf \"%.2f\" $value }}%!"
            summary: "Uso de disco alto na instância {{ $labels.instance }}."
        - alert: CriticalDiskUsage
          expr: >
            (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 90
          for: 2m
          labels:
            severity: critical
            channel: telegram-homelab
          annotations:
            description: "🚨 O uso de disco na instância *{{ $labels.instance }}* atingiu {{ printf \"%.2f\" $value }}%!"
            summary: "Uso de disco alto na instância {{ $labels.instance }}."

